[build-system]
requires = ["hatchling~=1.21"]
build-backend = "hatchling.build"

[project]
name = "jupyter_mcp_server"
authors = [{ name = "Datalayer", email = "info@datalayer.io" }]
dynamic = ["version"]
readme = "README.md"
requires-python = ">=3.14"
keywords = ["Jupyter"]
classifiers = [
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
]
dependencies = [
    "code-sandboxes<0.16",
    "datalayer_reactor",
    "jupyter-kernel-client==0.15.0",
    "jupyter-mcp-tools",
    "jupyter-nbmodel-client",
    "jupyter-server-nbmodel",
    "jupyter-server-client",
    "jupyter_server>=1.6,<3",
    "jupyter-collaboration",
    "tornado>=6.1",
    "traitlets>=5.0",
    "mcp[cli]>=1.10.1,<2",
    "pydantic",
    "uvicorn",
    "typer",
    "fastapi",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
]

[project.optional-dependencies]
colab = ["code-sandboxes[colab]"]
kaggle = ["code-sandboxes[kaggle]"]
monty = ["code-sandboxes[monty]"]
modal = ["code-sandboxes[modal]"]
datalayer = ["code-sandboxes[datalayer]"]
all-sandboxes = ["code-sandboxes[all]"]
test = [
    "ipykernel",
    "jupyter_server>=1.6,<3",
    "pytest>=7.0",
    "pytest-asyncio",
    "pytest-timeout>=2.1.0",
    "jupyterlab",
    "pillow>=10.0.0",
    "openapi-spec-validator",
]
lint = ["mdformat>0.7", "mdformat-gfm>=0.3.5", "ruff"]
typing = ["mypy>=0.990"]

[dependency-groups]
dev = [
    "ipykernel",
    "jupyter_server>=1.6,<3",
    "jupyter-mcp-sandboxes",
    "pytest>=7.0",
    "pytest-asyncio",
    "pytest-timeout>=2.1.0",
    "jupyterlab",
    "pillow>=10.0.0",
    "openapi-spec-validator",
    "mdformat>0.7",
    "mdformat-gfm>=0.3.5",
    "ruff",
    "mypy>=0.990",
]

[tool.uv.sources]
jupyter-mcp-sandboxes = { path = "ext/sandboxes", editable = true }

[project.scripts]
jupyter-mcp = "jupyter_mcp_server.cli.cli:serve"
jupyter-mcp-server = "jupyter_mcp_server.cli.cli:serve"
jupyter-assistant-api = "jupyter_mcp_server.assistant_api:main"
jupyter-kernel-watch = "jupyter_mcp_server.kernel_watcher:main"

[project.license]
file = "LICENSE"

[project.urls]
Home = "https://github.com/datalayer/jupyter-mcp-server"

[tool.hatch.version]
path = "jupyter_mcp_server/__version__.py"

[tool.hatch.build]
include = [
  "jupyter_mcp_server/**/*.py",
  "jupyter-config/**/*.json"
]

[tool.hatch.build.targets.wheel.shared-data]
"jupyter-config/jupyter_server_config.d" = "etc/jupyter/jupyter_server_config.d"
"jupyter-config/jupyter_notebook_config.d" = "etc/jupyter/jupyter_notebook_config.d"

[tool.pytest.ini_options]
filterwarnings = [
  "error",
  "ignore:There is no current event loop:DeprecationWarning",
  "module:make_current is deprecated:DeprecationWarning",
  "module:clear_current is deprecated:DeprecationWarning",
  "module:Jupyter is migrating its paths to use standard platformdirs:DeprecationWarning",
]
